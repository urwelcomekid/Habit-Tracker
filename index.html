<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Engine</title>

  <!-- Web & Mobile App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habit Engine">
  <meta name="application-name" content="Habit Engine">
  <meta name="theme-color" content="#090d16">

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;: &quot;Habit Engine&quot;,
    &quot;short_name&quot;: &quot;Habit Engine&quot;,
    &quot;start_url&quot;: &quot;.&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;%23090d16&quot;,
    &quot;theme_color&quot;: &quot;%23090d16&quot;,
    &quot;icons&quot;: [{
      &quot;src&quot;: &quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%23090d16'/><path d='M210 110 L150 330 L200 310 L230 360 L240 240 Z' fill='%23f43f5e' opacity='0.9'/><path d='M302 110 L362 330 L312 310 L282 360 L272 240 Z' fill='%23e11d48' opacity='0.7'/><circle cx='256' cy='220' r='110' fill='%23eab308'/><circle cx='256' cy='220' r='88' fill='%230f172a'/><path d='M205 220 L240 255 L310 185' fill='none' stroke='%23eab308' stroke-width='20' stroke-linecap='round' stroke-linejoin='round'/></svg>&quot;,
      &quot;sizes&quot;: &quot;512x512&quot;,

  }">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%23090d16'/><path d='M210 110 L150 330 L200 310 L230 360 L240 240 Z' fill='%23f43f5e' opacity='0.9'/><path d='M302 110 L362 330 L312 310 L282 360 L272 240 Z' fill='%23e11d48' opacity='0.7'/><circle cx='256' cy='220' r='110' fill='%23eab308'/><circle cx='256' cy='220' r='88' fill='%230f172a'/><path d='M205 220 L240 255 L310 185' fill='none' stroke='%23eab308' stroke-width='20' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Modern Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      letter-spacing: -0.02em;
    }

    .glass-panel {
      background: rgba(15, 20, 32, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .glass-input {
      background: rgba(8, 12, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-input:focus {
      background: rgba(8, 12, 20, 0.9);
      border-color: rgba(255, 255, 255, 0.25);
    }

    @media print {
      body {
        background-color: #ffffff !important;
        color: #0f172a !important;
      }
      .no-print {
        display: none !important;
      }
      .print-card {
        background-color: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        color: #0f172a !important;
        box-shadow: none !important;
      }
      .print-text {
        color: #0f172a !important;
      }
      .print-bar {
        background-color: #f43f5e !important;
      }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 selection:bg-rose-500 selection:text-white transition-colors duration-500">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Daily Motivational Quotes Collection
    const DAILY_QUOTES = [
      { quote: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle" },
      { quote: "You do not rise to the level of your goals. You fall to the level of your systems.", author: "James Clear" },
      { quote: "Small disciplines repeated with consistency every day lead to great achievements.", author: "John C. Maxwell" },
      { quote: "Energy flows where attention goes. Focus on building the new.", author: "Tony Robbins" },
      { quote: "Success isn't always about greatness. It's about consistency.", author: "Dwayne Johnson" },
      { quote: "The secret of your future is hidden in your daily routine.", author: "Mike Murdock" },
      { quote: "Motivation is what gets you started. Habit is what keeps you going.", author: "Jim Ryun" },
      { quote: "Action is the foundational key to all success.", author: "Pablo Picasso" },
      { quote: "Continuous improvement is better than delayed perfection.", author: "Mark Twain" },
      { quote: "It’s not what we do once in a while that shapes our lives, but what we do consistently.", author: "Tony Robbins" }
    ];

    // Modern Refined Color Themes
    const THEMES = {
      rose: {
        name: 'Rose Neon 🌸',
        bg: 'bg-[#08060e]',
        accent: 'from-rose-500 to-pink-600',
        textPrimary: 'from-white via-rose-100 to-rose-300',
        textSub: 'text-rose-200/70',
        btn: 'bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white shadow-lg shadow-rose-500/25 border border-rose-400/30',
        badge: 'bg-rose-500/10 text-rose-300 border-rose-500/20',
        barWeekly: 'bg-gradient-to-r from-rose-500 to-pink-500',
        barMonthly: 'bg-gradient-to-r from-pink-500 to-purple-500',
        textWeekly: 'text-rose-400',
        textMonthly: 'text-pink-300',
        checkedCard: 'bg-gradient-to-r from-rose-950/40 to-pink-950/20 border-rose-500/40 text-rose-100 shadow-lg shadow-rose-950/40'
      },
      violet: {
        name: 'Cyber Violet 💜',
        bg: 'bg-[#06050e]',
        accent: 'from-violet-500 to-fuchsia-600',
        textPrimary: 'from-white via-violet-100 to-violet-300',
        textSub: 'text-violet-200/70',
        btn: 'bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white shadow-lg shadow-violet-600/25 border border-violet-400/30',
        badge: 'bg-violet-500/10 text-violet-300 border-violet-500/20',
        barWeekly: 'bg-gradient-to-r from-violet-500 to-fuchsia-500',
        barMonthly: 'bg-gradient-to-r from-fuchsia-500 to-purple-500',
        textWeekly: 'text-violet-400',
        textMonthly: 'text-fuchsia-300',
        checkedCard: 'bg-gradient-to-r from-violet-950/40 to-fuchsia-950/20 border-violet-500/40 text-violet-100 shadow-lg shadow-violet-950/40'
      },
      emerald: {
        name: 'Emerald Aurora 🌿',
        bg: 'bg-[#030906]',
        accent: 'from-emerald-500 to-teal-600',
        textPrimary: 'from-white via-emerald-100 to-emerald-300',
        textSub: 'text-emerald-200/70',
        btn: 'bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-lg shadow-emerald-500/25 border border-emerald-400/30',
        badge: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20',
        barWeekly: 'bg-gradient-to-r from-emerald-500 to-teal-400',
        barMonthly: 'bg-gradient-to-r from-teal-500 to-cyan-500',
        textWeekly: 'text-emerald-400',
        textMonthly: 'text-teal-300',
        checkedCard: 'bg-gradient-to-r from-emerald-950/40 to-teal-950/20 border-emerald-500/40 text-emerald-100 shadow-lg shadow-emerald-950/40'
      },
      slate: {
        name: 'Obsidian Slate 🌙',
        bg: 'bg-[#06080d]',
        accent: 'from-cyan-500 to-blue-600',
        textPrimary: 'from-white via-slate-100 to-slate-300',
        textSub: 'text-slate-400',
        btn: 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white shadow-lg shadow-cyan-600/25 border border-cyan-400/30',
        badge: 'bg-cyan-500/10 text-cyan-300 border-cyan-500/20',
        barWeekly: 'bg-gradient-to-r from-cyan-500 to-blue-500',
        barMonthly: 'bg-gradient-to-r from-blue-500 to-indigo-500',
        textWeekly: 'text-cyan-400',
        textMonthly: 'text-blue-300',
        checkedCard: 'bg-gradient-to-r from-slate-900 to-slate-950 border-cyan-500/40 text-cyan-100 shadow-lg shadow-slate-950/80'
      }
    };

    function GoalTracker() {
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];

      const [currentTheme, setCurrentTheme] = useState(() => {
        return localStorage.getItem('app_theme') || 'rose';
      });

      const [goals, setGoals] = useState(() => {
        const saved = localStorage.getItem('app_goals');
        return saved ? JSON.parse(saved) : [];
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('app_logs');
        return saved ? JSON.parse(saved) : {};
      });

      const [weightLogs, setWeightLogs] = useState(() => {
        const saved = localStorage.getItem('app_weight_logs');
        return saved ? JSON.parse(saved) : {};
      });

      const [targetWeights, setTargetWeights] = useState(() => {
        const saved = localStorage.getItem('app_target_weights');
        return saved ? JSON.parse(saved) : {};
      });

      const [newGoalText, setNewGoalText] = useState('');
      const [editingGoalId, setEditingGoalId] = useState(null);
      const [editingGoalText, setEditingGoalText] = useState('');

      const [weightInput, setWeightInput] = useState('');
      const [targetWeightInput, setTargetWeightInput] = useState('');
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [currentMonth, setCurrentMonth] = useState(today.getMonth());
      const [currentYear, setCurrentYear] = useState(today.getFullYear());
      
      // Accordion state - Calendar minimized by default
      const [isCalendarOpen, setIsCalendarOpen] = useState(false);
      const [isAnalyticsOpen, setIsAnalyticsOpen] = useState(false);
      const [isWeightChartOpen, setIsWeightChartOpen] = useState(false);

      const hasWeightHabit = goals.some(
        g => g.title.toLowerCase().includes('weight')
      );

      const theme = THEMES[currentTheme] || THEMES.rose;
      const monthKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

      // Calculate daily quote index based on selectedDate
      const getDailyQuote = () => {
        let hash = 0;
        for (let i = 0; i < selectedDate.length; i++) {
          hash = selectedDate.charCodeAt(i) + ((hash << 5) - hash);
        }
        const quoteIndex = Math.abs(hash) % DAILY_QUOTES.length;
        return DAILY_QUOTES[quoteIndex];
      };

      const currentQuote = getDailyQuote();

      useEffect(() => {
        document.body.className = `${theme.bg} text-slate-100 min-h-screen antialiased transition-colors duration-500`;
        localStorage.setItem('app_theme', currentTheme);
      }, [currentTheme, theme]);

      useEffect(() => { localStorage.setItem('app_goals', JSON.stringify(goals)); }, [goals]);
      useEffect(() => { localStorage.setItem('app_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => { localStorage.setItem('app_weight_logs', JSON.stringify(weightLogs)); }, [weightLogs]);
      useEffect(() => { localStorage.setItem('app_target_weights', JSON.stringify(targetWeights)); }, [targetWeights]);

      useEffect(() => {
        setWeightInput(weightLogs[selectedDate] || '');
      }, [selectedDate, weightLogs]);

      useEffect(() => {
        setTargetWeightInput(targetWeights[monthKey] || '');
      }, [monthKey, targetWeights]);

      const toggleGoal = (goalId) => {
        if (editingGoalId === goalId) return;

        setLogs(prev => {
          const dateLogs = prev[selectedDate] || {};
          return {
            ...prev,
            [selectedDate]: {
              ...dateLogs,
              [goalId]: !dateLogs[goalId]
            }
          };
        });
      };

      const addGoal = (e) => {
        e.preventDefault();
        if (!newGoalText.trim()) return;
        const newGoal = { id: Date.now().toString(), title: newGoalText.trim() };
        setGoals([...goals, newGoal]);
        setNewGoalText('');
      };

      const startEditing = (goal, e) => {
        e.stopPropagation();
        setEditingGoalId(goal.id);
        setEditingGoalText(goal.title);
      };

      const saveEditing = (goalId, e) => {
        if (e) e.stopPropagation();
        if (!editingGoalText.trim()) return;
        setGoals(goals.map(g => g.id === goalId ? { ...g, title: editingGoalText.trim() } : g));
        setEditingGoalId(null);
        setEditingGoalText('');
      };

      const cancelEditing = (e) => {
        if (e) e.stopPropagation();
        setEditingGoalId(null);
        setEditingGoalText('');
      };

      const deleteGoal = (goalId, e) => {
        e.stopPropagation();
        setGoals(goals.filter(g => g.id !== goalId));
      };

      const handleWeightSave = (e) => {
        e.preventDefault();
        const val = parseFloat(weightInput);
        setWeightLogs(prev => {
          const updated = { ...prev };
          if (isNaN(val) || val <= 0) {
            delete updated[selectedDate];
          } else {
            updated[selectedDate] = val;
          }
          return updated;
        });
      };

      const handleTargetWeightSave = (e) => {
        e.preventDefault();
        const val = parseFloat(targetWeightInput);
        setTargetWeights(prev => {
          const updated = { ...prev };
          if (isNaN(val) || val <= 0) {
            delete updated[monthKey];
          } else {
            updated[monthKey] = val;
          }
          return updated;
        });
      };

      const getSingleGoalStats = (goalId, daysCount) => {
        let completedCount = 0;
        const baseDate = new Date(selectedDate);

        for (let i = 0; i < daysCount; i++) {
          const d = new Date(baseDate);
          d.setDate(baseDate.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          if (logs[dateStr]?.[goalId]) {
            completedCount++;
          }
        }

        const percentage = Math.round((completedCount / daysCount) * 100);
        return { completedCount, percentage };
      };

      const daysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();
      const firstDayOfMonth = (month, year) => new Date(year, month, 1).getDay();

      const handlePrevMonth = (e) => {
        e.stopPropagation();
        if (currentMonth === 0) {
          setCurrentMonth(11);
          setCurrentYear(currentYear - 1);
        } else {
          setCurrentMonth(currentMonth - 1);
        }
      };

      const handleNextMonth = (e) => {
        e.stopPropagation();
        if (currentMonth === 11) {
          setCurrentMonth(0);
          setCurrentYear(currentYear + 1);
        } else {
          setCurrentMonth(currentMonth + 1);
        }
      };

      const handleJumpToToday = () => {
        const now = new Date();
        setCurrentMonth(now.getMonth());
        setCurrentYear(now.getFullYear());
        setSelectedDate(now.toISOString().split('T')[0]);
      };

      const monthNames = [
        "January", "February", "March", "April", "May", "June", 
        "July", "August", "September", "October", "November", "December"
      ];

      const getMonthWeightData = () => {
        const totalDays = daysInMonth(currentMonth, currentYear);
        const data = [];

        for (let day = 1; day <= totalDays; day++) {
          const dateFormatted = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const val = weightLogs[dateFormatted];
          if (val !== undefined && val !== null) {
            data.push({ day, date: dateFormatted, weight: val });
          }
        }
        return data;
      };

      const monthWeightData = getMonthWeightData();
      const currentTargetWeight = targetWeights[monthKey];

      const getTrendColor = (currentWeight, prevWeight, targetWeight) => {
        if (currentWeight === prevWeight) return "#38bdf8";
        if (!targetWeight) {
          return currentWeight < prevWeight ? "#10b981" : "#f43f5e";
        }
        const prevDistance = Math.abs(prevWeight - targetWeight);
        const currDistance = Math.abs(currentWeight - targetWeight);
        return currDistance < prevDistance ? "#10b981" : currDistance > prevDistance ? "#f43f5e" : "#38bdf8";
      };

      const completedTodayCount = goals.filter(g => logs[selectedDate]?.[g.id]).length;
      const totalGoalsCount = goals.length;
      const progressPercent = totalGoalsCount > 0 ? Math.round((completedTodayCount / totalGoalsCount) * 100) : 0;

      return (
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-10 space-y-8">
          
          {/* Top Header */}
          <header class="flex flex-col space-y-4 pb-6 border-b border-white/10">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <div class="w-6 h-6 rounded-lg bg-gradient-to-tr from-rose-500 to-amber-400 flex items-center justify-center shadow-md">
                    <svg class="w-3.5 h-3.5 text-black stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
                  <span class="text-xs font-extrabold uppercase tracking-widest text-slate-400">Daily Engine</span>
                </div>
                <h1 class={`text-4xl font-extrabold tracking-tight bg-gradient-to-r ${theme.textPrimary} bg-clip-text text-transparent print-text`}>
                  Habit Engine
                </h1>
              </div>

              <div class="flex items-center gap-3 no-print">
                <div class="glass-panel px-3 py-1.5 rounded-2xl flex items-center gap-2 border border-white/10">
                  <span class="text-xs text-slate-400 font-medium pl-1">Theme:</span>
                  <select 
                    value={currentTheme}
                    onChange={(e) => setCurrentTheme(e.target.value)}
                    class="bg-transparent text-white text-xs font-semibold focus:outline-none cursor-pointer pr-1"
                  >
                    {Object.keys(THEMES).map(tKey => (
                      <option key={tKey} value={tKey} class="bg-slate-900 text-white">
                        {THEMES[tKey].name}
                      </option>
                    ))}
                  </select>
                </div>

                <button 
                  onClick={handleJumpToToday}
                  class="glass-panel hover:bg-white/10 text-white border border-white/10 text-xs font-bold px-4 py-2.5 rounded-2xl transition-all active:scale-95 flex items-center gap-1.5"
                >
                  <svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  Today
                </button>
                <button 
                  onClick={() => window.print()}
                  class={`${theme.btn} font-bold text-xs px-4 py-2.5 rounded-2xl transition-all active:scale-95 flex items-center gap-1.5`}
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                  PDF
                </button>
              </div>
            </div>

            {/* Daily Motivational Quote Bar */}
            <div class="glass-panel p-3.5 rounded-2xl flex items-center gap-3 border border-white/10 shadow-lg print-card">
              <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                  <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
                </svg>
              </div>
              <div class="space-y-0.5 text-xs">
                <p class="text-slate-200 font-semibold italic tracking-wide print-text">
                  "{currentQuote.quote}"
                </p>
                <p class={`font-bold ${theme.textWeekly} print-text`}>
                  — {currentQuote.author}
                </p>
              </div>
            </div>
          </header>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* Main Tracker Column */}
            <div class="lg:col-span-7 space-y-6">
              
              {/* Daily Progress Card */}
              <div class="glass-panel p-6 rounded-3xl relative overflow-hidden print-card">
                <div class="flex items-center justify-between relative z-10">
                  <div class="space-y-1">
                    <span class={`text-[11px] font-extrabold uppercase tracking-widest ${theme.textWeekly} print-text`}>
                      Active Workspace
                    </span>
                    <h2 class="text-2xl font-black text-white tracking-tight print-text">
                      {new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}
                    </h2>
                  </div>

                  <div class="text-right space-y-0.5">
                    <span class="text-3xl font-black text-white tracking-tight">{progressPercent}%</span>
                    <p class="text-[11px] text-slate-400 font-semibold">{completedTodayCount} of {totalGoalsCount} Completed</p>
                  </div>
                </div>

                <div class="mt-5 w-full bg-black/50 h-2 rounded-full overflow-hidden border border-white/5">
                  <div 
                    class={`h-full ${theme.barWeekly} transition-all duration-700 ease-out`}
                    style={{ width: `${progressPercent}%` }}
                  ></div>
                </div>
              </div>

              {/* Weight Quick Log Bar */}
              {hasWeightHabit && (
                <div class="glass-panel p-4 rounded-3xl space-y-3 no-print">
                  <div class="flex items-center justify-between px-1">
                    <div class="flex items-center gap-2">
                      <div class="w-6 h-6 rounded-lg bg-sky-500/20 text-sky-400 border border-sky-500/30 flex items-center justify-center">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 12h12l3-12H3z M12 6v12" />

                              const maxW = Math.max(...weights) + 2;
                              const range = maxW - minW || 1;

                              const width = 320;
                              const height = 140;
                              const padding = 20;

                              const getCoords = (idx, weight) => {
                                const x = padding + (idx / Math.max(monthWeightData.length - 1, 1)) * (width - padding * 2);

                                return { x, y };
                              };

                                ? height - padding - ((currentTargetWeight - minW) / range) * (height - padding * 2)

                                        x1={padding} 
                                        y1={targetY} 
                                        x2={width - padding} 
                                        y2={targetY}

                                        strokeWidth="1.5" 
                                        strokeDasharray="4 4" 
                                        opacity="0.6"
                                      />

                                  )}

                                    const p2 = getCoords(i, d.weight);
                                    const strokeColor = getTrendColor(d.weight, prev.weight, currentTargetWeight);

                                        key={`line-${i}`}
                                        x1={p1.x}
                                        y1={p1.y}
                                        x2={p2.x}
                                        y2={p2.y}
                                        stroke={strokeColor}
                                        strokeWidth="3"
                                        strokeLinecap="round"
                                      />
                                    );
                                  })}

                                    const prev = i > 0 ? monthWeightData[i - 1] : null;
                                    const dotColor = prev 
                                      ? getTrendColor(d.weight, prev.weight, currentTargetWeight)
                                      : "#38bdf8";

                                    return (
                                      <g key={`dot-${i}`} class="group cursor-pointer">
                                        <circle
                                          cx={p.x}
                                          cy={p.y}
                                          r="5"
                                          fill={dotColor}
                                          class="transition-all group-hover:r-7 stroke-2 stroke-black"

                              <h3 class="text-sm font-bold text-slate-200 truncate print-text">{goal.title}</h3>

                              <div class="space-y-1.5">
                                <div class="flex justify-between text-xs text-slate-400 font-semibold print-text">
                                  <span>7-Day Span</span>
                                  <span class={`font-bold ${theme.textWeekly}`}>{weekly.completedCount}/7 ({weekly.percentage}%)</span>
                                </div>
                                <div class="w-full bg-black/50 rounded-full h-2 overflow-hidden border border-white/5">
                                  <div 
                                    class={`${theme.barWeekly} h-full rounded-full transition-all duration-700 print-bar`}
                                    style={{ width: `${weekly.percentage}%` }}
                                  ></div>
                                </div>
                              </div>

                              <div class="space-y-1.5">
                                <div class="flex justify-between text-xs text-slate-400 font-semibold print-text">
                                  <span>30-Day Span</span>
                                  <span class={`font-bold ${theme.textMonthly}`}>{monthly.completedCount}/30 ({monthly.percentage}%)</span>
                                </div>
                                <div class="w-full bg-black/50 rounded-full h-2 overflow-hidden border border-white/5">
                                  <div 
                                    class={`${theme.barMonthly} h-full rounded-full transition-all duration-700 print-bar`}
                                    style={{ width: `${monthly.percentage}%` }}
                                  ></div>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GoalTracker />);
  </script>
</body>
</html>
