<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Engine</title>

  <!-- Web & Mobile App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habit Engine">
  <meta name="application-name" content="Habit Engine">
  <meta name="theme-color" content="#090d16">

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;: &quot;Habit Engine&quot;,
    &quot;short_name&quot;: &quot;Habit Engine&quot;,
    &quot;start_url&quot;: &quot;.&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;%23090d16&quot;,
    &quot;theme_color&quot;: &quot;%23090d16&quot;,
    &quot;icons&quot;: [{
      &quot;src&quot;: &quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%23090d16'/><path d='M210 110 L150 330 L200 310 L230 360 L240 240 Z' fill='%23f43f5e' opacity='0.9'/><path d='M302 110 L362 330 L312 310 L282 360 L272 240 Z' fill='%23e11d48' opacity='0.7'/><circle cx='256' cy='220' r='110' fill='%23eab308'/><circle cx='256' cy='220' r='88' fill='%230f172a'/><path d='M205 220 L240 255 L310 185' fill='none' stroke='%23eab308' stroke-width='20' stroke-linecap='round' stroke-linejoin='round'/></svg>&quot;,
      &quot;sizes&quot;: &quot;512x512&quot;,
      &quot;type&quot;: &quot;image/svg+xml&quot;,
      &quot;purpose&quot;: &quot;any maskable&quot;

  }">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%23090d16'/><path d='M210 110 L150 330 L200 310 L230 360 L240 240 Z' fill='%23f43f5e' opacity='0.9'/><path d='M302 110 L362 330 L312 310 L282 360 L272 240 Z' fill='%23e11d48' opacity='0.7'/><circle cx='256' cy='220' r='110' fill='%23eab308'/><circle cx='256' cy='220' r='88' fill='%230f172a'/><path d='M205 220 L240 255 L310 185' fill='none' stroke='%23eab308' stroke-width='20' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%23090d16'/><path d='M210 110 L150 330 L200 310 L230 360 L240 240 Z' fill='%23f43f5e' opacity='0.9'/><path d='M302 110 L362 330 L312 310 L282 360 L272 240 Z' fill='%23e11d48' opacity='0.7'/><circle cx='256' cy='220' r='110' fill='%23eab308'/><circle cx='256' cy='220' r='88' fill='%230f172a'/><path d='M205 220 L240 255 L310 185' fill='none' stroke='%23eab308' stroke-width='20' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      letter-spacing: -0.011em;
    }

    .glass-panel {
      background: rgba(18, 24, 38, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-input {
      background: rgba(10, 14, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-input:focus {
      background: rgba(10, 14, 23, 0.85);
      border-color: rgba(255, 255, 255, 0.25);
    }

    @media print {
      body {
        background-color: #ffffff !important;
        color: #0f172a !important;
      }
      .no-print {
        display: none !important;
      }
      .print-card {
        background-color: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        color: #0f172a !important;
        box-shadow: none !important;
      }
      .print-text {
        color: #0f172a !important;
      }
      .print-bar {
        background-color: #f43f5e !important;
      }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 selection:bg-rose-500 selection:text-white transition-colors duration-500">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Modern Refined Color Themes
    const THEMES = {
      rose: {
        name: 'Rose Neon 🌸',
        bg: 'bg-[#0b0813]',
        accent: 'from-rose-500 to-pink-600',
        accentGlow: 'shadow-rose-500/20',
        textPrimary: 'from-white via-rose-100 to-rose-300',
        textSub: 'text-rose-200/70',
        btn: 'bg-rose-500 hover:bg-rose-400 text-white shadow-lg shadow-rose-500/25 border border-rose-400/30',
        badge: 'bg-rose-500/10 text-rose-300 border-rose-500/20',
        barWeekly: 'bg-gradient-to-r from-rose-500 to-pink-500',
        barMonthly: 'bg-gradient-to-r from-pink-500 to-purple-500',
        textWeekly: 'text-rose-400',
        textMonthly: 'text-pink-300',
        checkedCard: 'bg-gradient-to-r from-rose-950/40 to-pink-950/20 border-rose-500/40 text-rose-100 shadow-lg shadow-rose-950/50'
      },
      violet: {
        name: 'Cyber Violet 💜',
        bg: 'bg-[#090714]',
        accent: 'from-violet-500 to-fuchsia-600',
        accentGlow: 'shadow-violet-500/20',
        textPrimary: 'from-white via-violet-100 to-violet-300',
        textSub: 'text-violet-200/70',
        btn: 'bg-violet-600 hover:bg-violet-500 text-white shadow-lg shadow-violet-600/25 border border-violet-400/30',
        badge: 'bg-violet-500/10 text-violet-300 border-violet-500/20',
        barWeekly: 'bg-gradient-to-r from-violet-500 to-fuchsia-500',
        barMonthly: 'bg-gradient-to-r from-fuchsia-500 to-purple-500',
        textWeekly: 'text-violet-400',
        textMonthly: 'text-fuchsia-300',
        checkedCard: 'bg-gradient-to-r from-violet-950/40 to-fuchsia-950/20 border-violet-500/40 text-violet-100 shadow-lg shadow-violet-950/50'
      },
      emerald: {
        name: 'Emerald Aurora 🌿',
        bg: 'bg-[#050e0a]',
        accent: 'from-emerald-500 to-teal-600',
        accentGlow: 'shadow-emerald-500/20',
        textPrimary: 'from-white via-emerald-100 to-emerald-300',
        textSub: 'text-emerald-200/70',
        btn: 'bg-emerald-500 hover:bg-emerald-400 text-white shadow-lg shadow-emerald-500/25 border border-emerald-400/30',
        badge: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20',
        barWeekly: 'bg-gradient-to-r from-emerald-500 to-teal-400',
        barMonthly: 'bg-gradient-to-r from-teal-500 to-cyan-500',
        textWeekly: 'text-emerald-400',
        textMonthly: 'text-teal-300',
        checkedCard: 'bg-gradient-to-r from-emerald-950/40 to-teal-950/20 border-emerald-500/40 text-emerald-100 shadow-lg shadow-emerald-950/50'
      },
      slate: {
        name: 'Obsidian Slate 🌙',
        bg: 'bg-[#080b11]',
        accent: 'from-cyan-500 to-blue-600',
        accentGlow: 'shadow-cyan-500/20',
        textPrimary: 'from-white via-slate-100 to-slate-300',
        textSub: 'text-slate-400',
        btn: 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-lg shadow-cyan-600/25 border border-cyan-400/30',
        badge: 'bg-cyan-500/10 text-cyan-300 border-cyan-500/20',
        barWeekly: 'bg-gradient-to-r from-cyan-500 to-blue-500',
        barMonthly: 'bg-gradient-to-r from-blue-500 to-indigo-500',
        textWeekly: 'text-cyan-400',
        textMonthly: 'text-blue-300',
        checkedCard: 'bg-gradient-to-r from-slate-900 to-slate-950 border-cyan-500/40 text-cyan-100 shadow-lg shadow-slate-950/80'
      }
    };

    function GoalTracker() {
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];

      const [currentTheme, setCurrentTheme] = useState(() => {
        return localStorage.getItem('app_theme') || 'rose';
      });

      const [goals, setGoals] = useState(() => {
        const saved = localStorage.getItem('app_goals');
        return saved ? JSON.parse(saved) : [];
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('app_logs');
        return saved ? JSON.parse(saved) : {};
      });

      const [weightLogs, setWeightLogs] = useState(() => {
        const saved = localStorage.getItem('app_weight_logs');
        return saved ? JSON.parse(saved) : {};
      });

      const [targetWeights, setTargetWeights] = useState(() => {
        const saved = localStorage.getItem('app_target_weights');
        return saved ? JSON.parse(saved) : {};
      });

      const [newGoalText, setNewGoalText] = useState('');
      const [editingGoalId, setEditingGoalId] = useState(null);
      const [editingGoalText, setEditingGoalText] = useState('');

      const [weightInput, setWeightInput] = useState('');
      const [targetWeightInput, setTargetWeightInput] = useState('');
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [currentMonth, setCurrentMonth] = useState(today.getMonth());
      const [currentYear, setCurrentYear] = useState(today.getFullYear());
      
      const [isAnalyticsOpen, setIsAnalyticsOpen] = useState(true);
      const [isWeightChartOpen, setIsWeightChartOpen] = useState(true);

      const hasWeightHabit = goals.some(
        g => g.title.toLowerCase().includes('weight')
      );

      const theme = THEMES[currentTheme] || THEMES.rose;
      const monthKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

      useEffect(() => {
        document.body.className = `${theme.bg} text-slate-100 min-h-screen antialiased transition-colors duration-500`;
        localStorage.setItem('app_theme', currentTheme);
      }, [currentTheme, theme]);

      useEffect(() => { localStorage.setItem('app_goals', JSON.stringify(goals)); }, [goals]);
      useEffect(() => { localStorage.setItem('app_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => { localStorage.setItem('app_weight_logs', JSON.stringify(weightLogs)); }, [weightLogs]);
      useEffect(() => { localStorage.setItem('app_target_weights', JSON.stringify(targetWeights)); }, [targetWeights]);

      useEffect(() => {
        setWeightInput(weightLogs[selectedDate] || '');
      }, [selectedDate, weightLogs]);

      useEffect(() => {
        setTargetWeightInput(targetWeights[monthKey] || '');
      }, [monthKey, targetWeights]);

      const toggleGoal = (goalId) => {
        if (editingGoalId === goalId) return;

        setLogs(prev => {
          const dateLogs = prev[selectedDate] || {};
          return {
            ...prev,
            [selectedDate]: {
              ...dateLogs,
              [goalId]: !dateLogs[goalId]
            }
          };
        });
      };

      const addGoal = (e) => {
        e.preventDefault();
        if (!newGoalText.trim()) return;
        const newGoal = { id: Date.now().toString(), title: newGoalText.trim() };
        setGoals([...goals, newGoal]);
        setNewGoalText('');
      };

      const startEditing = (goal, e) => {
        e.stopPropagation();
        setEditingGoalId(goal.id);
        setEditingGoalText(goal.title);
      };

      const saveEditing = (goalId, e) => {
        if (e) e.stopPropagation();
        if (!editingGoalText.trim()) return;
        setGoals(goals.map(g => g.id === goalId ? { ...g, title: editingGoalText.trim() } : g));
        setEditingGoalId(null);
        setEditingGoalText('');
      };

      const cancelEditing = (e) => {
        if (e) e.stopPropagation();
        setEditingGoalId(null);
        setEditingGoalText('');
      };

      const deleteGoal = (goalId, e) => {
        e.stopPropagation();
        setGoals(goals.filter(g => g.id !== goalId));
      };

      const handleWeightSave = (e) => {
        e.preventDefault();
        const val = parseFloat(weightInput);
        setWeightLogs(prev => {
          const updated = { ...prev };
          if (isNaN(val) || val <= 0) {
            delete updated[selectedDate];
          } else {
            updated[selectedDate] = val;
          }
          return updated;
        });
      };

      const handleTargetWeightSave = (e) => {
        e.preventDefault();
        const val = parseFloat(targetWeightInput);
        setTargetWeights(prev => {
          const updated = { ...prev };
          if (isNaN(val) || val <= 0) {
            delete updated[monthKey];
          } else {
            updated[monthKey] = val;
          }
          return updated;
        });
      };

      const getSingleGoalStats = (goalId, daysCount) => {
        let completedCount = 0;
        const baseDate = new Date(selectedDate);

        for (let i = 0; i < daysCount; i++) {
          const d = new Date(baseDate);
          d.setDate(baseDate.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          if (logs[dateStr]?.[goalId]) {
            completedCount++;
          }
        }

        const percentage = Math.round((completedCount / daysCount) * 100);
        return { completedCount, percentage };
      };

      const daysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();
      const firstDayOfMonth = (month, year) => new Date(year, month, 1).getDay();

      const handlePrevMonth = () => {
        if (currentMonth === 0) {
          setCurrentMonth(11);
          setCurrentYear(currentYear - 1);
        } else {
          setCurrentMonth(currentMonth - 1);
        }
      };

      const handleNextMonth = () => {
        if (currentMonth === 11) {
          setCurrentMonth(0);
          setCurrentYear(currentYear + 1);
        } else {
          setCurrentMonth(currentMonth + 1);
        }
      };

      const handleJumpToToday = () => {
        const now = new Date();
        setCurrentMonth(now.getMonth());
        setCurrentYear(now.getFullYear());
        setSelectedDate(now.toISOString().split('T')[0]);
      };

      const monthNames = [
        "January", "February", "March", "April", "May", "June", 
        "July", "August", "September", "October", "November", "December"
      ];

      const getMonthWeightData = () => {
        const totalDays = daysInMonth(currentMonth, currentYear);
        const data = [];

        for (let day = 1; day <= totalDays; day++) {
          const dateFormatted = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const val = weightLogs[dateFormatted];
          if (val !== undefined && val !== null) {
            data.push({ day, date: dateFormatted, weight: val });
          }
        }
        return data;
      };

      const monthWeightData = getMonthWeightData();
      const currentTargetWeight = targetWeights[monthKey];

      const getTrendColor = (currentWeight, prevWeight, targetWeight) => {
        if (currentWeight === prevWeight) return "#38bdf8";
        if (!targetWeight) {
          return currentWeight < prevWeight ? "#10b981" : "#f43f5e";
        }
        const prevDistance = Math.abs(prevWeight - targetWeight);
        const currDistance = Math.abs(currentWeight - targetWeight);
        return currDistance < prevDistance ? "#10b981" : currDistance > prevDistance ? "#f43f5e" : "#38bdf8";
      };

      // Active completed stats for today
      const completedTodayCount = goals.filter(g => logs[selectedDate]?.[g.id]).length;
      const totalGoalsCount = goals.length;
      const progressPercent = totalGoalsCount > 0 ? Math.round((completedTodayCount / totalGoalsCount) * 100) : 0;

      return (
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-10 space-y-8">
          
          {/* Top Modern Header */}
          <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-white/10">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
                <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Personal Tracker</span>
              </div>
              <h1 class={`text-4xl font-black tracking-tight bg-gradient-to-r ${theme.textPrimary} bg-clip-text text-transparent print-text`}>
                Habit Engine
              </h1>
            </div>

            <div class="flex items-center gap-3 no-print">
              <div class="glass-panel px-3 py-1.5 rounded-2xl flex items-center gap-2 border border-white/10">
                <span class="text-xs text-slate-400 font-medium pl-1">Theme:</span>
                <select 
                  value={currentTheme}
                  onChange={(e) => setCurrentTheme(e.target.value)}
                  class="bg-transparent text-white text-xs font-semibold focus:outline-none cursor-pointer pr-1"
                >
                  {Object.keys(THEMES).map(tKey => (
                    <option key={tKey} value={tKey} class="bg-slate-900 text-white">
                      {THEMES[tKey].name}
                    </option>
                  ))}
                </select>
              </div>

              <button 
                onClick={handleJumpToToday}
                class="glass-panel hover:bg-white/10 text-white border border-white/10 text-xs font-semibold px-4 py-2.5 rounded-2xl transition-all active:scale-95"
              >
                Today
              </button>
              <button 
                onClick={() => window.print()}
                class={`${theme.btn} font-semibold text-xs px-4 py-2.5 rounded-2xl transition-all active:scale-95`}
              >
                Export PDF
              </button>
            </div>
          </header>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* Main Column */}
            <div class="lg:col-span-7 space-y-6">
              
              {/* Daily Progress Banner */}
              <div class={`glass-panel p-6 rounded-3xl relative overflow-hidden print-card`}>
                <div class="flex items-center justify-between relative z-10">
                  <div class="space-y-1">
                    <span class={`text-xs font-bold uppercase tracking-widest ${theme.textWeekly} print-text`}>Selected Date</span>
                    <h2 class="text-2xl font-extrabold text-white print-text">
                      {new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}
                    </h2>
                  </div>

                  <div class="text-right space-y-1">
                    <span class="text-2xl font-black text-white">{progressPercent}%</span>
                    <p class="text-[11px] text-slate-400 font-medium">{completedTodayCount} of {totalGoalsCount} Done</p>
                  </div>
                </div>

                {/* Progress bar line */}
                <div class="mt-4 w-full bg-black/40 h-1.5 rounded-full overflow-hidden border border-white/5">
                  <div 
                    class={`h-full ${theme.barWeekly} transition-all duration-700 ease-out`}
                    style={{ width: `${progressPercent}%` }}
                  ></div>
                </div>
              </div>

              {/* Weight Log Bar */}
              {hasWeightHabit && (
                <div class="glass-panel p-4 rounded-3xl space-y-3 no-print">
                  <div class="flex items-center justify-between px-1">
                    <div class="flex items-center gap-2">
                      <span class="text-base">⚖️</span>
                      <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">Weight Log</h3>
                    </div>
                    {weightLogs[selectedDate] && (
                      <span class="text-xs text-slate-300">
                        Logged: <strong class="text-white font-semibold">{weightLogs[selectedDate]} lbs</strong>
                      </span>
                    )}
                  </div>

                  <form onSubmit={handleWeightSave} class="flex items-center gap-2">
                    <div class="relative flex-1">
                      <input
                        type="number"
                        step="0.1"
                        placeholder="Enter weight for this date..."
                        value={weightInput}
                        onChange={(e) => setWeightInput(e.target.value)}
                        class="w-full glass-input rounded-2xl pl-4 pr-12 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none transition shadow-inner"
                      />
                      <span class="absolute right-4 top-3 text-xs text-slate-400 font-semibold pointer-events-none">lbs</span>
                    </div>
                    <button
                      type="submit"
                      class={`${theme.btn} font-semibold text-xs px-5 py-3 rounded-2xl transition shadow-md active:scale-95`}
                    >
                      Save
                    </button>
                  </form>
                </div>
              )}

              {/* Add New Goal Bar */}
              <form onSubmit={addGoal} class="relative flex items-center no-print">
                <input
                  type="text"
                  placeholder="Create new habit..."
                  value={newGoalText}
                  onChange={(e) => setNewGoalText(e.target.value)}
                  class="w-full glass-input rounded-2xl pl-5 pr-32 py-4 text-sm text-white placeholder-slate-500 focus:outline-none transition-all shadow-inner"
                />
                <button 
                  type="submit"
                  class={`absolute right-2 ${theme.btn} font-semibold text-xs px-5 py-2.5 rounded-xl transition shadow-md active:scale-95`}
                >
                  Add Habit
                </button>
              </form>

              {/* Habit Cards Grid */}
              <div class="space-y-3">
                {goals.length === 0 ? (
                  <div class="glass-panel rounded-3xl p-12 text-center space-y-3 print-card">
                    <div class="w-14 h-14 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mx-auto text-slate-300 text-xl no-print">
                      ✨
                    </div>
                    <h3 class="font-bold text-slate-200 text-lg print-text">Your list is clean</h3>
                    <p class={`text-xs ${theme.textSub} max-w-xs mx-auto print-text`}>
                      Add habits above to build your daily routine. Add "Weight" (e.g. Weight ⚖️) to enable graph tracking!
                    </p>
                  </div>
                ) : (
                  goals.map(goal => {
                    const isDone = logs[selectedDate]?.[goal.id] || false;
                    const isEditing = editingGoalId === goal.id;

                    return (
                      <div 
                        key={goal.id}
                        onClick={() => toggleGoal(goal.id)}
                        class={`group flex items-center justify-between p-4 rounded-2xl border transition-all duration-300 select-none cursor-pointer print-card ${
                          isDone 
                            ? theme.checkedCard 
                            : 'glass-panel text-slate-200 hover:border-white/20 hover:bg-white/[0.03]'
                        }`}
                      >
                        <div class="flex items-center gap-4 flex-1 mr-3">
                          <div class={`w-7 h-7 rounded-xl flex items-center justify-center border transition-all duration-300 flex-shrink-0 ${
                            isDone 
                              ? `${theme.btn} scale-105` 
                              : 'border-white/20 bg-white/5 group-hover:border-white/40'
                          }`}>
                            {isDone && (
                              <svg class="w-4 h-4 stroke-current stroke-[3]" viewBox="0 0 24 24" fill="none">
                                <path d="M5 13l4 4L19 7" strokeLinecap="round" strokeLinejoin="round"/>
                              </svg>
                            )}
                          </div>
                          
                          {isEditing ? (
                            <div class="flex items-center gap-2 flex-1 no-print" onClick={(e) => e.stopPropagation()}>
                              <input
                                type="text"
                                autoFocus
                                value={editingGoalText}
                                onChange={(e) => setEditingGoalText(e.target.value)}
                                onKeyDown={(e) => {
                                  if (e.key === 'Enter') saveEditing(goal.id, e);
                                  if (e.key === 'Escape') cancelEditing(e);
                                }}
                                class="w-full glass-input rounded-xl px-3 py-1.5 text-sm text-white focus:outline-none"
                              />
                              <button
                                onClick={(e) => saveEditing(goal.id, e)}
                                class="text-emerald-400 hover:text-emerald-300 p-1 font-bold text-xs"
                                title="Save"
                              >
                                ✓
                              </button>
                              <button
                                onClick={cancelEditing}
                                class="text-slate-400 hover:text-slate-200 p-1 font-bold text-xs"
                                title="Cancel"
                              >
                                ✕
                              </button>
                            </div>
                          ) : (
                            <span class={`font-medium text-sm transition-all print-text ${isDone ? 'line-through opacity-60' : 'text-slate-100'}`}>
                              {goal.title}
                            </span>
                          )}
                        </div>

                        {!isEditing && (
                          <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity no-print">
                            <button 
                              onClick={(e) => startEditing(goal, e)}
                              class="text-slate-400 hover:text-amber-300 p-1.5 rounded-lg hover:bg-white/5 transition"
                              title="Edit"
                            >
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                              </svg>
                            </button>
                            <button 
                              onClick={(e) => deleteGoal(goal.id, e)}
                              class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-white/5 transition"
                              title="Delete"
                            >
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                              </svg>
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            </div>

            {/* Sidebar Column */}
            <div class="lg:col-span-5 space-y-6">
              
              {/* Calendar Widget */}
              <div class="glass-panel rounded-3xl p-6 shadow-2xl space-y-4 no-print">
                <div class="flex items-center justify-between pb-3 border-b border-white/10">
                  <div class="flex items-center gap-2">
                    <button onClick={handlePrevMonth} class="text-slate-400 hover:text-white p-1 transition">‹</button>
                    <span class="font-bold text-sm text-slate-100">
                      {monthNames[currentMonth]} {currentYear}
                    </span>
                    <button onClick={handleNextMonth} class="text-slate-400 hover:text-white p-1 transition">›</button>
                  </div>

                  <div class="flex items-center gap-1">
                    <select 
                      value={currentMonth} 
                      onChange={(e) => setCurrentMonth(Number(e.target.value))}
                      class="bg-black/40 border border-white/10 rounded-xl text-xs text-slate-300 px-2 py-1 focus:outline-none"
                    >
                      {monthNames.map((m, idx) => (
                        <option key={m} value={idx} class="bg-slate-900">{m.substring(0, 3)}</option>
                      ))}
                    </select>
                    <select 
                      value={currentYear} 
                      onChange={(e) => setCurrentYear(Number(e.target.value))}
                      class="bg-black/40 border border-white/10 rounded-xl text-xs text-slate-300 px-2 py-1 focus:outline-none"
                    >
                      {[2024, 2025, 2026, 2027, 2028].map(y => (
                        <option key={y} value={y} class="bg-slate-900">{y}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div class="grid grid-cols-7 gap-1 text-center">
                  {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => (
                    <span key={d} class="text-[10px] font-bold text-slate-500 py-1">{d}</span>
                  ))}

                  {Array.from({ length: firstDayOfMonth(currentMonth, currentYear) }).map((_, i) => (
                    <div key={`empty-${i}`} class="h-8"></div>
                  ))}

                  {Array.from({ length: daysInMonth(currentMonth, currentYear) }).map((_, i) => {
                    const dayNum = i + 1;
                    const dateFormatted = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                    const isSelected = dateFormatted === selectedDate;
                    const isToday = dateFormatted === todayStr;

                    return (
                      <button
                        key={dayNum}
                        onClick={() => setSelectedDate(dateFormatted)}
                        class={`h-8 w-8 mx-auto rounded-xl text-xs font-semibold flex items-center justify-center transition-all duration-200 ${
                          isSelected
                            ? `${theme.btn} scale-105`
                            : isToday
                            ? `border border-white/20 text-white bg-white/5`
                            : 'text-slate-400 hover:bg-white/10 hover:text-white'
                        }`}
                      >
                        {dayNum}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Weight Analytics */}
              {hasWeightHabit && (
                <div class="glass-panel rounded-3xl overflow-hidden shadow-2xl print-card">
                  <button 
                    onClick={() => setIsWeightChartOpen(!isWeightChartOpen)}
                    class="w-full p-6 flex items-center justify-between text-left hover:bg-white/5 transition no-print"
                  >
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold text-slate-200 uppercase tracking-widest print-text">Weight Trend</span>
                      <span class="text-[10px] bg-white/5 text-slate-400 px-2 py-0.5 rounded-full font-mono border border-white/10">
                        {monthWeightData.length} Logs
                      </span>
                    </div>
                    
                    <div class="flex items-center gap-2">
                      <span class={`text-xs font-semibold ${theme.textWeekly}`}>
                        {isWeightChartOpen ? 'Hide Graph' : 'Show Graph'}
                      </span>
                      <svg 
                        class={`w-4 h-4 text-slate-400 transition-transform duration-300 ${isWeightChartOpen ? 'rotate-180' : ''}`} 
                        fill="none" 
                        stroke="currentColor" 
                        viewBox="0 0 24 24"
                      >
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                      </svg>
                    </div>
                  </button>

                  {(isWeightChartOpen || window.matchMedia('print').matches) && (
                    <div class="px-6 pb-6 pt-1 border-t border-white/10 space-y-4">
                      
                      <form onSubmit={handleTargetWeightSave} class="flex items-center justify-between gap-2 bg-black/30 p-3 rounded-2xl border border-white/5 no-print">
                        <span class="text-xs text-slate-400 font-medium">Goal for {monthNames[currentMonth]}:</span>
                        <div class="flex items-center gap-2">
                          <div class="relative w-24">
                            <input
                              type="number"
                              step="0.1"
                              placeholder="Target"
                              value={targetWeightInput}
                              onChange={(e) => setTargetWeightInput(e.target.value)}
                              class="w-full glass-input rounded-xl pl-2.5 pr-8 py-1 text-xs text-white placeholder-slate-500 focus:outline-none"
                            />
                            <span class="absolute right-2.5 top-1 text-[10px] text-slate-400 font-semibold pointer-events-none">lbs</span>
                          </div>
                          <button
                            type="submit"
                            class="bg-white/10 hover:bg-white/20 text-white font-semibold text-xs px-3 py-1 rounded-xl transition"
                          >
                            Set
                          </button>
                        </div>
                      </form>

                      {monthWeightData.length === 0 ? (
                        <p class="text-xs text-slate-400 text-center py-6 print-text">
                          No entries for {monthNames[currentMonth]}. Enter your daily weight to render trend lines.
                        </p>
                      ) : (
                        <div class="space-y-4">
                          <div class="flex items-center justify-between text-xs text-slate-300 border-b border-white/5 pb-2">
                            <span>Start: <strong class="text-white">{monthWeightData[0].weight} lbs</strong></span>
                            {currentTargetWeight && (
                              <span>Goal: <strong class="text-emerald-400 font-semibold">{currentTargetWeight} lbs</strong></span>
                            )}
                            {monthWeightData.length > 0 && (() => {
                              const latest = monthWeightData[monthWeightData.length - 1].weight;
                              if (!currentTargetWeight) {
                                return <span>Latest: <strong class="text-white">{latest} lbs</strong></span>;
                              }
                              const toGoal = (latest - currentTargetWeight).toFixed(1);
                              return (
                                <span class="font-bold text-slate-200">
                                  {toGoal == 0 ? '🎯 Target Hit!' : toGoal > 0 ? `${toGoal} lbs left` : `${Math.abs(toGoal)} lbs under`}
                                </span>
                              );
                            })()}
                          </div>

                          <div class="w-full h-44 relative pt-2">
                            {(() => {
                              const weights = monthWeightData.map(d => d.weight);
                              if (currentTargetWeight) weights.push(currentTargetWeight);

                              const minW = Math.min(...weights) - 2;
                              const maxW = Math.max(...weights) + 2;
                              const range = maxW - minW || 1;

                              const width = 320;
                              const height = 140;
                              const padding = 20;

                              const getCoords = (idx, weight) => {
                                const x = padding + (idx / Math.max(monthWeightData.length - 1, 1)) * (width - padding * 2);
                                const y = height - padding - ((weight - minW) / range) * (height - padding * 2);
                                return { x, y };
                              };

                              const targetY = currentTargetWeight 
                                ? height - padding - ((currentTargetWeight - minW) / range) * (height - padding * 2) 
                                : null;

                              return (
                                <svg viewBox={`0 0 ${width} ${height}`} class="w-full h-full overflow-visible">
                                  <line x1={padding} y1={padding} x2={width - padding} y2={padding} stroke="currentColor" class="text-white/5" strokeDasharray="2" />
                                  <line x1={padding} y1={height / 2} x2={width - padding} y2={height / 2} stroke="currentColor" class="text-white/5" strokeDasharray="2" />
                                  <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="currentColor" class="text-white/5" strokeDasharray="2" />

                                  {targetY !== null && (
                                    <g>
                                      <line 
                                        x1={padding} 
                                        y1={targetY} 
                                        x2={width - padding} 
                                        y2={targetY} 
                                        stroke="#10b981" 
                                        strokeWidth="1.5" 
                                        strokeDasharray="4 4" 
                                        opacity="0.6"
                                      />
                                      <text x={width - padding} y={targetY - 4} textAnchor="end" fill="#10b981" fontSize="7" fontWeight="bold">
                                        Goal: {currentTargetWeight} lbs
                                      </text>
                                    </g>
                                  )}

                                  {monthWeightData.map((d, i) => {
                                    if (i === 0) return null;
                                    const prev = monthWeightData[i - 1];
                                    const p1 = getCoords(i - 1, prev.weight);
                                    const p2 = getCoords(i, d.weight);
                                    const strokeColor = getTrendColor(d.weight, prev.weight, currentTargetWeight);

                                    return (
                                      <line
                                        key={`line-${i}`}
                                        x1={p1.x}
                                        y1={p1.y}
                                        x2={p2.x}
                                        y2={p2.y}
                                        stroke={strokeColor}
                                        strokeWidth="3"
                                        strokeLinecap="round"
                                      />
                                    );
                                  })}

                                  {monthWeightData.map((d, i) => {
                                    const p = getCoords(i, d.weight);
                                    const prev = i > 0 ? monthWeightData[i - 1] : null;
                                    const dotColor = prev 
                                      ? getTrendColor(d.weight, prev.weight, currentTargetWeight)
                                      : "#38bdf8";

                                    return (
                                      <g key={`dot-${i}`} class="group cursor-pointer">
                                        <circle
                                          cx={p.x}
                                          cy={p.y}
                                          r="5"
                                          fill={dotColor}
                                          class="transition-all group-hover:r-7 stroke-2 stroke-black"
                                        />
                                        <title>{`${d.date}: ${d.weight} lbs`}</title>
                                        <text
                                          x={p.x}
                                          y={p.y - 9}
                                          textAnchor="middle"
                                          fill="#ffffff"
                                          fontSize="8"
                                          fontWeight="bold"
                                          class="opacity-0 group-hover:opacity-100 transition-opacity"
                                        >
                                          {d.weight}
                                        </text>
                                      </g>
                                    );
                                  })}
                                </svg>
                              );
                            })()}
                          </div>

                          <div class="flex items-center justify-center gap-4 text-[10px] text-slate-400 pt-1">
                            <div class="flex items-center gap-1.5">
                              <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                              <span>{currentTargetWeight ? 'Towards Goal' : 'Decreased'}</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                              <span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>
                              <span>{currentTargetWeight ? 'Away From Goal' : 'Increased'}</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                              <span class="w-2 h-2 rounded-full bg-sky-400 inline-block"></span>
                              <span>Same</span>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* Individual Breakdown */}
              <div class="glass-panel rounded-3xl overflow-hidden shadow-2xl print-card">
                <button 
                  onClick={() => setIsAnalyticsOpen(!isAnalyticsOpen)}
                  class="w-full p-6 flex items-center justify-between text-left hover:bg-white/5 transition no-print"
                >
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-200 uppercase tracking-widest print-text">Analytics Breakdown</span>
                    <span class="text-[10px] bg-white/5 text-slate-400 px-2 py-0.5 rounded-full font-mono border border-white/10">
                      {goals.length} Habits
                    </span>
                  </div>
                  
                  <div class="flex items-center gap-2">
                    <span class={`text-xs font-semibold ${theme.textWeekly}`}>
                      {isAnalyticsOpen ? 'Hide Stats' : 'Show Stats'}
                    </span>
                    <svg 
                      class={`w-4 h-4 text-slate-400 transition-transform duration-300 ${isAnalyticsOpen ? 'rotate-180' : ''}`} 
                      fill="none" 
                      stroke="currentColor" 
                      viewBox="0 0 24 24"
                    >
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                    </svg>
                  </div>
                </button>

                {(isAnalyticsOpen || window.matchMedia('print').matches) && (
                  <div class="px-6 pb-6 pt-1 border-t border-white/10 space-y-5">
                    {goals.length === 0 ? (
                      <p class="text-xs text-slate-400 text-center py-4 print-text">Add habits above to generate completion stats.</p>
                    ) : (
                      <div class="space-y-5 divide-y divide-white/10">
                        {goals.map(goal => {
                          const weekly = getSingleGoalStats(goal.id, 7);
                          const monthly = getSingleGoalStats(goal.id, 30);

                          return (
                            <div key={goal.id} class="pt-4 first:pt-0 space-y-3">
                              <h3 class="text-sm font-semibold text-slate-200 truncate print-text">{goal.title}</h3>

                              <div class="space-y-1.5">
                                <div class="flex justify-between text-xs text-slate-400 print-text">
                                  <span>7-Day Span</span>
                                  <span class={`font-bold ${theme.textWeekly}`}>{weekly.completedCount}/7 ({weekly.percentage}%)</span>
                                </div>
                                <div class="w-full bg-black/40 rounded-full h-2 overflow-hidden border border-white/5">
                                  <div 
                                    class={`${theme.barWeekly} h-full rounded-full transition-all duration-700 print-bar`}
                                    style={{ width: `${weekly.percentage}%` }}
                                  ></div>
                                </div>
                              </div>

                              <div class="space-y-1.5">
                                <div class="flex justify-between text-xs text-slate-400 print-text">
                                  <span>30-Day Span</span>
                                  <span class={`font-bold ${theme.textMonthly}`}>{monthly.completedCount}/30 ({monthly.percentage}%)</span>
                                </div>
                                <div class="w-full bg-black/40 rounded-full h-2 overflow-hidden border border-white/5">
                                  <div 
                                    class={`${theme.barMonthly} h-full rounded-full transition-all duration-700 print-bar`}
                                    style={{ width: `${monthly.percentage}%` }}
                                  ></div>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GoalTracker />);
  </script>
</body>
</html>
